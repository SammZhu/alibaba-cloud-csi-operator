name: CI

on:
  push:
    branches: ["main"]
    # Cut a release whenever a v* tag is pushed (e.g. v0.1.0). The tag is the
    # operator release version and must equal v$(Makefile VERSION). On a tag the
    # CI builds + pushes operator, bundle and catalog images at the tag, then
    # syncs the version into the alibaba-openshift deploy repo (sync-deploy-tag).
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go fmt
        run: |
          gofmt_files=$(gofmt -l $(find . -name '*.go' | grep -v vendor))
          if [ -n "$gofmt_files" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$gofmt_files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: CGO_ENABLED=0 go build ./...

      - name: go test (unit only, no envtest)
        run: go test -v -count=1 -timeout=120s $(go list ./... | grep -v /e2e)

      - name: govulncheck (Go vulnerability scan)
        # Fails on vulnerabilities reachable from this module's code, including the
        # Go standard library (build toolchain). Complements the image Trivy scan.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  kind-smoke:
    name: kind smoke (operator reconcile)
    runs-on: ubuntu-latest
    needs: build-test
    # Runs the operator out-of-cluster against a throwaway kind cluster and asserts
    # it reconciles every managed object + CR status against a real API server.
    # Hermetic — no Alibaba cloud. ubuntu runners ship docker + kubectl.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        run: |
          # -f so curl fails on a 404 instead of writing the error body; sudo
          # install because /usr/local/bin is not writable by the runner user on
          # ubuntu-24. /releases/latest avoids pinning a version that may not exist.
          curl -fsSL -o ./kind https://github.com/kubernetes-sigs/kind/releases/latest/download/kind-linux-amd64
          sudo install -m 0755 ./kind /usr/local/bin/kind && rm -f ./kind
          kind version

      - name: Run kind smoke
        run: make test-kind-smoke

  manifests:
    name: Validate generated manifests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install controller-gen
        # Pin to the same version as Makefile CONTROLLER_TOOLS_VERSION so the
        # regenerated manifests match what was committed locally with `make manifests`.
        run: go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.18.0

      - name: Regenerate manifests
        run: |
          controller-gen rbac:roleName=manager-role crd webhook paths="./..." output:crd:artifacts:config=config/crd/bases
          controller-gen object:headerFile="hack/boilerplate.go.txt" paths="./..."

      - name: Check for uncommitted manifest changes
        run: |
          if ! git diff --quiet; then
            echo "Generated manifests differ from committed files. Run 'make manifests generate' locally and commit the result."
            git diff
            exit 1
          fi

  bundle-validate:
    name: Validate OLM bundle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install operator-sdk
        run: |
          OS=$(go env GOOS)
          ARCH=$(go env GOARCH)
          curl -sSLo /usr/local/bin/operator-sdk \
            "https://github.com/operator-framework/operator-sdk/releases/download/v1.42.2/operator-sdk_${OS}_${ARCH}"
          chmod +x /usr/local/bin/operator-sdk

      - name: Validate bundle
        run: operator-sdk bundle validate ./bundle --select-optional suite=operatorframework

  # Builds the operator container image with podman and runs Red Hat preflight checks.
  # Requires QUAY_USERNAME / QUAY_PASSWORD secrets for push, and
  # PFLT_PYXIS_API_TOKEN + PFLT_CERTIFICATION_PROJECT_ID for preflight submission.
  container-build:
    name: Build & Preflight (podman)
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: write   # commit the CI-pinned bundle back to main on release

    steps:
      - uses: actions/checkout@v7

      - name: Install podman
        run: |
          sudo apt-get update -q
          sudo apt-get install -y podman

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Compute the image references.
      #   main push  → primary tag = short SHA (mutable dev image)
      #   v* tag push → primary tag = the tag name (= v$(VERSION)); release.
      # The release tag MUST equal v$(Makefile VERSION) so the bundle CSV version
      # and the image tag agree — fail loudly otherwise.
      - name: Compute image tags
        id: tags
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION=$(awk -F'?= ' '/^VERSION \?=/ {print $2; exit}' Makefile)
          BASE=quay.io/samzhu/alibaba-cloud-csi-operator
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "${TAG}" != "v${VERSION}" ]]; then
              echo "::error::release tag ${TAG} != v${VERSION} (Makefile VERSION). Bump VERSION in lockstep with the tag."
              exit 1
            fi
            echo "is_release=true"                  >> "$GITHUB_OUTPUT"
            echo "primary=${BASE}:${TAG}"           >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false"                 >> "$GITHUB_OUTPUT"
            echo "primary=${BASE}:${SHORT_SHA}"     >> "$GITHUB_OUTPUT"
          fi
          echo "version=v${VERSION}"                >> "$GITHUB_OUTPUT"
          echo "image_ver=${BASE}:v${VERSION}"      >> "$GITHUB_OUTPUT"
          echo "image_latest=${BASE}:latest"        >> "$GITHUB_OUTPUT"
          echo "bundle_img=${BASE}-bundle:v${VERSION}"   >> "$GITHUB_OUTPUT"
          echo "catalog_img=${BASE}-catalog:v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build operator image
        run: |
          podman build \
            --platform linux/amd64 \
            -t ${{ steps.tags.outputs.primary }} \
            -t ${{ steps.tags.outputs.image_latest }} \
            -f Dockerfile .
          # Save the just-built image as a tarball so Trivy can scan it locally on
          # PRs too (PRs do not push to the registry — scanning by remote ref would
          # fail with MANIFEST_UNKNOWN).
          podman save -o /tmp/operator-image.tar ${{ steps.tags.outputs.primary }}

      # Push BEFORE preflight: preflight pulls the image manifest directly
      # from the registry, NOT from local podman storage, so the image must
      # already be in the registry. Without this ordering, preflight fetches
      # whatever stale tag exists in quay.io — possibly a different
      # architecture than the one CI just built — and fails with
      # "platform mismatch: requested amd64 but image is arm64".
      #
      # GitHub Actions does NOT allow `secrets` / `env` references in step-level
      # `if` conditions. Gate on event type at step level, then push the secret
      # check down into bash so the step always runs and no-ops on forks.
      - name: Push operator image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          if [ -z "$QUAY_USERNAME" ]; then
            echo "QUAY_USERNAME secret not configured — skipping push."
            exit 0
          fi
          echo "$QUAY_PASSWORD" | podman login quay.io -u "$QUAY_USERNAME" --password-stdin
          podman push --digestfile=/tmp/operator.digest ${{ steps.tags.outputs.primary }}
          podman push ${{ steps.tags.outputs.image_latest }}

      - name: Install preflight
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          curl -sSLo /usr/local/bin/preflight \
            "https://github.com/redhat-openshift-ecosystem/openshift-preflight/releases/latest/download/preflight-linux-amd64"
          chmod +x /usr/local/bin/preflight

      # Runs against the just-pushed image. PRs skip preflight because they
      # do not push, and there is no image in the registry to validate.
      # NOTE: set PFLT_PYXIS_API_TOKEN and PFLT_CERTIFICATION_PROJECT_ID secrets
      # to enable --submit and upload results to Red Hat Connect.
      - name: Run preflight check container (local, no submission)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          DOCKER_CONFIG: /tmp/empty-docker-config
        run: |
          mkdir -p "$DOCKER_CONFIG" && echo '{}' > "$DOCKER_CONFIG/config.json"
          preflight check container ${{ steps.tags.outputs.primary }}

      # Trivy scan — Red Hat-equivalent CVE gate.
      # Fails the job on HIGH or CRITICAL CVEs in the operator image.
      # Runs on every push and PR (not gated on main) so scoring catches
      # regressions before merge. Vulnerabilities in the upstream UBI base
      # image are common — when one appears, either bump the base image
      # tag or add to .trivyignore with a documented justification.
      - name: Trivy CVE scan (operator image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Scan the locally-built image tarball (works on PRs, where the image is
          # not pushed to the registry).
          input: /tmp/operator-image.tar
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library

      # Bundle + catalog — RELEASE ONLY (v* tag). These are the OLM artifacts the
      # air-gap mirror pre-pulls and OLM installs from. Built only on a tag so
      # :v$(VERSION) bundle/catalog are immutable release images (not rebuilt on
      # every main commit). The bundle must be pushed before catalog-build, which
      # runs `opm index add --bundles <bundle image>` against the registry.
      - name: Pin bundle + build/push bundle & catalog (release only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          if [ -z "$QUAY_USERNAME" ]; then
            echo "QUAY_USERNAME secret not configured — skipping bundle/catalog push."
            exit 0
          fi
          echo "$QUAY_PASSWORD" | podman login quay.io -u "$QUAY_USERNAME" --password-stdin
          # The operator image (:v$(VERSION), amd64) was built + pushed above. CI is
          # the SINGLE builder, so pin the committed bundle to ITS freshly-published
          # digest right here — no pre-pin, no non-reproducible-digest mismatch. Then
          # build the bundle/catalog IMAGES from the pinned committed dir (the SSOT;
          # never `make bundle`, which reflows the CSV + dupes relatedImages).
          IMG_VER='${{ steps.tags.outputs.image_ver }}'
          IMG_REPO="${IMG_VER%:*}"
          DIGEST=$(cat /tmp/operator.digest)   # sha256:… 由 push --digestfile 写入(registry 权威 digest)          
          python3 hack/pin-operator-digest.py bundle/manifests/*.clusterserviceversion.yaml \
            --repo "$IMG_REPO" --digest "$DIGEST"
          echo "OPERATOR_IMG_REPO=$IMG_REPO" >> "$GITHUB_ENV"
          echo "OPERATOR_DIGEST=$DIGEST"     >> "$GITHUB_ENV"
          make bundle-build bundle-push
          make catalog-build catalog-push BUNDLE_IMGS=${{ steps.tags.outputs.bundle_img }}

      - name: Commit the re-pinned bundle back to main (release only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && env.OPERATOR_DIGEST != ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main FETCH_HEAD
          python3 hack/pin-operator-digest.py bundle/manifests/*.clusterserviceversion.yaml \
            --repo "$OPERATOR_IMG_REPO" --digest "$OPERATOR_DIGEST"
          if git diff --quiet; then
            echo "main already pinned to $OPERATOR_DIGEST"
          else
            git add bundle/manifests/*.clusterserviceversion.yaml
            git commit -s -m "chore(release): pin bundle to operator digest ${{ steps.tags.outputs.version }} [skip ci]"
            git push origin HEAD:main
          fi
      
      # NOTE: `preflight check operator` is intentionally NOT run in CI.
      # Unlike `preflight check container` which inspects the image manifest
      # statically, `preflight check operator` actually deploys the bundle via
      # OLM to a live cluster and runs the OperatorSDK Scorecard against it.
      # That requires a real OpenShift cluster with OLM installed (KUBECONFIG).
      # The static checks that DON'T need a cluster are already covered by:
      #   - `Validate OLM bundle` job (operator-sdk bundle validate)
      #   - `Validate generated manifests` job (controller-gen diff check)
      # Run preflight check operator manually against a real cluster:
      #   preflight check operator quay.io/samzhu/alibaba-cloud-csi-operator-bundle:vX.Y.Z

  cross-compile:
    name: Cross-compile Linux amd64 binary
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: write   # commit the CI-pinned bundle back to main on release

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux amd64 binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w" \
            -o bin/manager-linux-amd64 \
            ./cmd/main.go
          echo "Binary size: $(du -sh bin/manager-linux-amd64 | cut -f1)"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: manager-linux-amd64
          path: bin/manager-linux-amd64
          retention-days: 7

  sync-deploy-tag:
    name: Sync CSI operator version to alibaba-openshift
    runs-on: ubuntu-latest
    needs: container-build
    # Only on a v* release tag (not main SHA builds). After the operator/bundle/
    # catalog images are pushed, bump csi_operator_image_tag in the deploy repo's
    # SSOT (ansible/vars/images.yml) and commit it, so a plain `git pull` over
    # there picks up the new version (used by 04-prepare-mirror's air-gap pre-pull
    # list and build-mirror-tarball.sh). Mirrors the CAPA provider's sync-deploy-tag.
    # Requires repo secret ANSIBLE_REPO_TOKEN = a PAT with contents:write on
    # SammZhu/alibaba-openshift. Without it, this job no-ops.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Check sync token configured
        id: guard
        env:
          ANSIBLE_REPO_TOKEN: ${{ secrets.ANSIBLE_REPO_TOKEN }}
        run: |
          if [ -z "$ANSIBLE_REPO_TOKEN" ]; then
            echo "ANSIBLE_REPO_TOKEN not set — skipping deploy-repo sync (configure it to enable)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout alibaba-openshift
        if: steps.guard.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          repository: SammZhu/alibaba-openshift
          ref: main
          token: ${{ secrets.ANSIBLE_REPO_TOKEN }}

      - name: Bump csi_operator_image_tag and push
        if: steps.guard.outputs.ok == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          file=ansible/vars/images.yml
          sed -i -E "s|^csi_operator_image_tag:.*|csi_operator_image_tag: \"${TAG}\"|" "$file"
          grep -E '^csi_operator_image_tag:' "$file"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "csi_operator_image_tag already ${TAG} — nothing to commit."
            exit 0
          fi
          git add "$file"
          git commit -m "chore(images): bump csi_operator_image_tag to ${TAG} (auto from csi-operator CI)"
          git push origin main
