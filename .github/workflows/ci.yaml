name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go fmt
        run: |
          gofmt_files=$(gofmt -l $(find . -name '*.go' | grep -v vendor))
          if [ -n "$gofmt_files" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$gofmt_files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: CGO_ENABLED=0 go build ./...

      - name: go test (unit only, no envtest)
        run: go test -v -count=1 -timeout=120s $(go list ./... | grep -v /e2e)

  manifests:
    name: Validate generated manifests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install controller-gen
        # Pin to the same version as Makefile CONTROLLER_TOOLS_VERSION so the
        # regenerated manifests match what was committed locally with `make manifests`.
        run: go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.18.0

      - name: Regenerate manifests
        run: |
          controller-gen rbac:roleName=manager-role crd webhook paths="./..." output:crd:artifacts:config=config/crd/bases
          controller-gen object:headerFile="hack/boilerplate.go.txt" paths="./..."

      - name: Check for uncommitted manifest changes
        run: |
          if ! git diff --quiet; then
            echo "Generated manifests differ from committed files. Run 'make manifests generate' locally and commit the result."
            git diff
            exit 1
          fi

  bundle-validate:
    name: Validate OLM bundle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install operator-sdk
        run: |
          OS=$(go env GOOS)
          ARCH=$(go env GOARCH)
          curl -sSLo /usr/local/bin/operator-sdk \
            "https://github.com/operator-framework/operator-sdk/releases/download/v1.42.2/operator-sdk_${OS}_${ARCH}"
          chmod +x /usr/local/bin/operator-sdk

      - name: Validate bundle
        run: operator-sdk bundle validate ./bundle --select-optional suite=operatorframework

  # Builds the operator container image with podman and runs Red Hat preflight checks.
  # Requires QUAY_USERNAME / QUAY_PASSWORD secrets for push, and
  # PFLT_PYXIS_API_TOKEN + PFLT_CERTIFICATION_PROJECT_ID for preflight submission.
  container-build:
    name: Build & Preflight (podman)
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v4

      - name: Install podman
        run: |
          sudo apt-get update -q
          sudo apt-get install -y podman

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute image tags
        id: tags
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION=$(awk -F'?= ' '/^VERSION \?=/ {print $2; exit}' Makefile)
          BASE=quay.io/samzhu/alibaba-cloud-csi-operator
          echo "version=v${VERSION}"             >> "$GITHUB_OUTPUT"
          echo "image_sha=${BASE}:${SHORT_SHA}"  >> "$GITHUB_OUTPUT"
          echo "image_ver=${BASE}:v${VERSION}"   >> "$GITHUB_OUTPUT"
          echo "image_latest=${BASE}:latest"     >> "$GITHUB_OUTPUT"

      - name: Build operator image
        run: |
          podman build \
            --platform linux/amd64 \
            -t ${{ steps.tags.outputs.image_ver }} \
            -t ${{ steps.tags.outputs.image_sha }} \
            -t ${{ steps.tags.outputs.image_latest }} \
            -f Dockerfile .

      # Push BEFORE preflight: preflight pulls the image manifest directly
      # from the registry, NOT from local podman storage, so the image must
      # already be in the registry. Without this ordering, preflight fetches
      # whatever stale tag exists in quay.io — possibly a different
      # architecture than the one CI just built — and fails with
      # "platform mismatch: requested amd64 but image is arm64".
      #
      # GitHub Actions does NOT allow `secrets` / `env` references in step-level
      # `if` conditions. Gate on event type at step level, then push the secret
      # check down into bash so the step always runs and no-ops on forks.
      - name: Push operator image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          if [ -z "$QUAY_USERNAME" ]; then
            echo "QUAY_USERNAME secret not configured — skipping push."
            exit 0
          fi
          echo "$QUAY_PASSWORD" | podman login quay.io -u "$QUAY_USERNAME" --password-stdin
          podman push ${{ steps.tags.outputs.image_ver }}
          podman push ${{ steps.tags.outputs.image_sha }}
          podman push ${{ steps.tags.outputs.image_latest }}

      - name: Install preflight
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -sSLo /usr/local/bin/preflight \
            "https://github.com/redhat-openshift-ecosystem/openshift-preflight/releases/latest/download/preflight-linux-amd64"
          chmod +x /usr/local/bin/preflight

      # Runs against the just-pushed image. PRs skip preflight because they
      # do not push, and there is no image in the registry to validate.
      # NOTE: set PFLT_PYXIS_API_TOKEN and PFLT_CERTIFICATION_PROJECT_ID secrets
      # to enable --submit and upload results to Red Hat Connect.
      - name: Run preflight check container (local, no submission)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKER_CONFIG: /tmp/empty-docker-config
        run: |
          mkdir -p "$DOCKER_CONFIG" && echo '{}' > "$DOCKER_CONFIG/config.json"
          preflight check container ${{ steps.tags.outputs.image_ver }}

      # Trivy scan — Red Hat-equivalent CVE gate.
      # Fails the job on HIGH or CRITICAL CVEs in the operator image.
      # Runs on every push and PR (not gated on main) so scoring catches
      # regressions before merge. Vulnerabilities in the upstream UBI base
      # image are common — when one appears, either bump the base image
      # tag or add to .trivyignore with a documented justification.
      - name: Trivy CVE scan (operator image)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.tags.outputs.image_ver }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library

      # Bundle build/push/preflight — validates that the OLM bundle metadata,
      # CSV examples, and CRDs are all consistent with the operator image
      # we just published. preflight check operator is the bundle-side
      # equivalent of preflight check container.
      - name: Build and push bundle image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          if [ -z "$QUAY_USERNAME" ]; then
            echo "QUAY_USERNAME secret not configured — skipping bundle push."
            exit 0
          fi
          # operator-sdk is needed for bundle generation. Install matches the
          # bundle-validate job earlier in the workflow.
          curl -sSLo /usr/local/bin/operator-sdk \
            "https://github.com/operator-framework/operator-sdk/releases/download/v1.42.2/operator-sdk_linux_amd64"
          chmod +x /usr/local/bin/operator-sdk
          # Use Makefile defaults for BUNDLE_IMG — they expand from VERSION
          # to quay.io/samzhu/alibaba-cloud-csi-operator-bundle:v$(VERSION).
          make bundle bundle-build bundle-push IMG=${{ steps.tags.outputs.image_ver }}

      - name: Run preflight check operator (bundle, no submission)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKER_CONFIG: /tmp/empty-docker-config
        run: |
          mkdir -p "$DOCKER_CONFIG" && echo '{}' > "$DOCKER_CONFIG/config.json"
          # Bundle image follows the same {version} tag as the operator image.
          BUNDLE_IMG=quay.io/samzhu/alibaba-cloud-csi-operator-bundle:${{ steps.tags.outputs.version }}
          preflight check operator "$BUNDLE_IMG"

  cross-compile:
    name: Cross-compile Linux amd64 binary
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux amd64 binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w" \
            -o bin/manager-linux-amd64 \
            ./cmd/main.go
          echo "Binary size: $(du -sh bin/manager-linux-amd64 | cut -f1)"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: manager-linux-amd64
          path: bin/manager-linux-amd64
          retention-days: 7
