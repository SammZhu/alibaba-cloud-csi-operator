resources:
- manager.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
  # Operator image tag = operator release version (independent of the bundled
  # csi-driver imageTag). Bump in lockstep with Makefile VERSION on release.
images:
- name: controller
  newName: quay.io/samzhu/alibaba-cloud-csi-operator
  newTag: v0.1.3
